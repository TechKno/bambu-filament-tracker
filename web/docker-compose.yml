services:
  filament-tracker:
    build: .
    image: filament-tracker
    container_name: filament-tracker
    ports:
      - "8087:8000"        # browse to http://localhost:8087
    environment:
      # Local time for all displayed/stored timestamps (handles GMT/BST itself).
      - TZ=Europe/London
    volumes:
      - ./data:/data       # filament_data.json, settings.json, backups/, pending/ live here
      - ./secrets:/secrets # printer access codes (writable so the Printers panel can save them)
    restart: unless-stopped

  mqtt-listener:
    build: ./listener
    image: filament-mqtt-listener
    container_name: filament-mqtt
    depends_on:
      - filament-tracker
    environment:
      - FILAMENT_DATA_DIR=/data
      - TZ=Europe/London        # keep capture timestamps in local time
      - MQTT_RECORD_SECONDS=20  # snapshot full report state every 20s + on state change (0 = off)
    volumes:
      - ./data:/data           # shares pending/, status, recordings/ with the app
      - ./secrets:/secrets:ro  # printer_codes.env (SERIAL=ACCESSCODE per line)
    restart: unless-stopped
